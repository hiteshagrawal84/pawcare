# Isolated Hostinger demo deploy — project name "petcare"
# Joins createswowtech_internal so Caddy can reach containers.
# Publishes NO host ports (won't collide with other apps).
#
# Usage on VPS:
#   cd /opt/petcare
#   docker compose -f docker-compose.hostinger.yml up -d --build
#   docker compose -f docker-compose.hostinger.yml exec backend npm run seed

name: petcare

services:
  mongo:
    image: mongo:7
    container_name: petcare-mongo
    restart: unless-stopped
    volumes:
      - petcare_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - default

  backend:
    container_name: petcare-backend
    build:
      context: ./backend
      target: production
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/pawcare
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: https://demo.createswowtech.com/petcare
      CORS_ORIGIN: https://demo.createswowtech.com,https://demo.createswowtech.com/petcare
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: "10485760"
      # Local uploads (no MinIO required for demo)
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
    volumes:
      - petcare_uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - default
      - createswowtech_internal

  frontend:
    container_name: petcare-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        NEXT_PUBLIC_BASE_PATH: /petcare
        NEXT_PUBLIC_API_URL: https://demo.createswowtech.com/petcare/api
        NEXT_PUBLIC_SITE_URL: https://demo.createswowtech.com/petcare
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_BASE_PATH: /petcare
      NEXT_PUBLIC_API_URL: https://demo.createswowtech.com/petcare/api
      NEXT_PUBLIC_SITE_URL: https://demo.createswowtech.com/petcare
    depends_on:
      - backend
    networks:
      - default
      - createswowtech_internal

networks:
  createswowtech_internal:
    external: true

volumes:
  petcare_mongo_data:
  petcare_uploads:
